<div class="auth-centered-layout">
  <div class="auth-card">
    <div class="auth-card-header">
      <svg width="38" height="38" viewBox="0 0 40 40" fill="none" style="flex:none">
        <rect x="3.5" y="6" width="33" height="29" rx="2.5" fill="#d8a155"/>
        <rect x="3.5" y="6" width="33" height="6.5" fill="rgba(0,0,0,0.18)"/>
        <text x="20" y="28" text-anchor="middle" font-family="serif" font-weight="700"
              font-size="12" fill="#1f1a14" letter-spacing="0.5">DAD</text>
      </svg>
      <div>
        <div class="auth-card-title">Double authentification</div>
        <div class="auth-card-sub">Day After Day · Vérification de connexion</div>
      </div>
    </div>

    <p class="auth-card-desc">
      Saisissez le code à 6 chiffres affiché par votre application d'authentification
      (Google Authenticator, Authy, 1Password…).
    </p>

    <div class="field" style="margin-bottom:16px;">
      <label class="field-label">Code de vérification</label>
      <input
        class="input"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="123 456"
        autocomplete="one-time-code"
        autofocus
        style="font-family:var(--font-mono, monospace); letter-spacing:0.3em; font-size:22px; text-align:center;"
        [value]="code()"
        (input)="code.set($any($event.target).value)"
        (keydown.enter)="submit()"
      />
    </div>

    @if (errorMessage()) {
      <div class="auth-error">{{ errorMessage() }}</div>
    }

    <button class="btn btn-primary btn-lg" type="button"
            [disabled]="loading() || code().length < 6"
            (click)="submit()"
            style="width:100%; margin-top:8px;">
      @if (loading()) { <span class="spinner"></span> }
      Vérifier et continuer →
    </button>

    <hr class="rule" style="margin:24px 0" />
    <p class="auth-card-note">
      <a routerLink="/login" class="btn-link">← Retour à la connexion</a>
    </p>
  </div>
</div>
