<div class="auth-centered-layout">
  <div class="auth-card">

    <div class="auth-card-header">
      <svg width="38" height="38" viewBox="0 0 40 40" fill="none" style="flex:none">
        <rect x="3.5" y="6" width="33" height="29" rx="2.5" fill="#d8a155"/>
        <rect x="3.5" y="6" width="33" height="6.5" fill="rgba(0,0,0,0.18)"/>
        <text x="20" y="28" text-anchor="middle" font-family="serif" font-weight="700"
              font-size="12" fill="#1f1a14" letter-spacing="0.5">DAD</text>
      </svg>
      <div>
        <div class="auth-card-title">E-mail confirmé</div>
        <div class="auth-card-sub">Day After Day · Système de Gestion de Contenu</div>
      </div>
    </div>

    <div class="auth-success-box">
      <tui-icon icon="@tui.check-circle" style="font-size:20px;" />
      <p>
        Votre nouvelle adresse e-mail a été confirmée. Vous pouvez désormais l'utiliser pour vous connecter.
      </p>
    </div>

    <p class="auth-card-note">
      <a routerLink="/profil" class="btn-link">← Retour à mon profil</a>
    </p>
  </div>
</div>
