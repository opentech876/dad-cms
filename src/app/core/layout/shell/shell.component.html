<div class="shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">D</div>
      <span class="sidebar__name">Day After Day</span>
    </div>

    <nav class="sidebar__nav">
      <a class="sidebar__item" routerLink="/dashboard" routerLinkActive="sidebar__item--active" [routerLinkActiveOptions]="{exact: false}">
        <tui-icon icon="@tui.layout-dashboard" class="sidebar__icon" />
        <span>Tableau de bord</span>
      </a>
      <a class="sidebar__item" routerLink="/calendrier" routerLinkActive="sidebar__item--active">
        <tui-icon icon="@tui.calendar" class="sidebar__icon" />
        <span>Calendrier</span>
      </a>
      <a class="sidebar__item" routerLink="/evenements" routerLinkActive="sidebar__item--active">
        <tui-icon icon="@tui.book-open" class="sidebar__icon" />
        <span>Événements</span>
      </a>
      <a class="sidebar__item" routerLink="/campagnes" routerLinkActive="sidebar__item--active">
        <tui-icon icon="@tui.megaphone" class="sidebar__icon" />
        <span>Campagnes</span>
      </a>
      <a class="sidebar__item" routerLink="/utilisateurs" routerLinkActive="sidebar__item--active">
        <tui-icon icon="@tui.users" class="sidebar__icon" />
        <span>Utilisateurs</span>
      </a>
      <a class="sidebar__item" routerLink="/metriques" routerLinkActive="sidebar__item--active">
        <tui-icon icon="@tui.bar-chart-2" class="sidebar__icon" />
        <span>Métriques</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="sidebar__avatar">{{ userEmail[0]?.toUpperCase() }}</div>
        <span class="sidebar__email">{{ userEmail }}</span>
      </div>
      <button class="sidebar__logout" (click)="logout()" title="Se déconnecter">
        <tui-icon icon="@tui.log-out" />
      </button>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
